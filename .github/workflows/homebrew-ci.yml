name: Homebrew Release Tooling CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4
      - name: Test stable channel, artifact integrity, and update ordering
        run: python3 -m unittest discover -s scripts/tests -v

  packaging:
    name: Homebrew Install, Launch, Upgrade, and Uninstall
    runs-on: macos-26
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4
        with:
          persist-credentials: false
      - name: Verify published releases and exercise a disposable installation
        run: scripts/test-homebrew.sh --launch
      - name: Upload launch diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: homebrew-launch-diagnostics
          path: ${{ runner.temp }}/HomebrewLaunchDiagnostics
          if-no-files-found: ignore
